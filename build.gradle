import java.util.Date;

apply plugin: "base"
apply plugin: 'java'
apply plugin: 'java-library'

defaultTasks "clean", "createPluginZip"

sourceCompatibility = 1.8
targetCompatibility = 1.8

def getDate() {
    def date = new Date()
    def formattedDate = date.format('yyyy.MMdd.HHmmss')
    return formattedDate
}

repositories {
    mavenCentral()
    flatDir { dirs 'lib' }
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
        }
    }
}

def spLibs = fileTree(dir: 'lib')
spLibs.include "identityiq.jar"
spLibs.include "connector-bundle.jar"
spLibs.include "connector-bundle-identityiq.jar"

def includeLibs = fileTree(dir: 'includes')
includeLibs.include "*.jar"

dependencies {
    implementation includeLibs

    compileOnly spLibs
    compileOnly group: 'javax.servlet', name: 'javax.servlet-api', version: '4.0.1'
	compileOnly group: 'commons-logging', name: 'commons-logging', version: '1.1.3'
	compileOnly group: 'log4j', name: 'log4j', version: '1.2.17'
	compileOnly group: 'org.beanshell', name: 'bsh', version: '2.0b5'
	compileOnly(group: 'org.glassfish.jersey.bundles', name: 'jaxrs-ri', version: '2.22.2') {
		transitive = false
	}
}

tasks.register("angularBuild", Exec) {
    workingDir './ui'
    commandLine './ng-build.sh'
}

tasks.register('createPluginZip', Zip) {
	archiveFileName = archivesBaseName + ".zip"
	
    into('jars') {
        from jar
        from includeLibs
    }
    into('import/install') {
    	from("config") {
    		include "**"
    		exclude "*Example*"
    	}
    }
    from('.') {
        include 'manifest.xml'
        include 'db/**'
    	include 'messages/**'
        include 'ui/page.xhtml'
        include 'ui/js/**/*.js'
        include 'ui/css/**/*.css'
        filter { it.replace("%%BUILD_VERSION%%", getDate() ) }
    }

    dependsOn 'jar'

    dependsOn 'angularBuild'
}
