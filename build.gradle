import java.util.Date;

plugins {
    id 'java'
    id 'java-library'
}

defaultTasks "clean", "createPluginZip"

static String getDate() {
    def date = new Date()
    def formattedDate = date.format('yyyy.MMdd.HHmmss')
    return formattedDate
}

repositories {
    mavenCentral()
    flatDir { dirs 'lib' }
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

configurations {
    // Use this configuration in 'dependencies' to include libraries in the plugin zip
    includeLibraries
    api.extendsFrom includeLibraries
}

def spLibs = fileTree(dir: 'lib')
spLibs.include "*.jar"

def includeLibs = fileTree(dir: 'includes')
includeLibs.include "*.jar"

dependencies {
    // Anything using 'includeLibraries' will be packaged into the plugin zip
    includeLibraries includeLibs

    // Replace with whatever SailPoint libraries are needed
    compileOnly spLibs
    compileOnly group: 'javax.servlet', name: 'javax.servlet-api', version: '4.0.1'
	compileOnly group: 'commons-logging', name: 'commons-logging', version: '1.1.3'
	compileOnly group: 'log4j', name: 'log4j', version: '1.2.17'
	compileOnly group: 'org.beanshell', name: 'bsh', version: '2.0b5'
    compileOnly group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.13.2.+'
	compileOnly(group: 'org.glassfish.jersey.bundles', name: 'jaxrs-ri', version: '2.35') {
		transitive = false
	}
}

tasks.register("angularBuild", Exec) {
    environment 'PROJECT_NAME', getProperty("sp.ui.project.name")
    environment 'PLUGIN_NAME', getProperty("sp.plugin.name")
    workingDir './ui'
    commandLine './ng-build.sh'

    inputs.dir './ui/src'
    inputs.file './ui/ng-build.sh'
    inputs.file './ui/package.json'
    inputs.file './ui/tsconfig.json'
    inputs.file './ui/tsconfig.app.json'
    inputs.file './ui/angular.json'
    inputs.file './ui/page-template.xhtml'
    outputs.dirs './ui/js', './ui/css'
    outputs.file './ui/page.xhtml'
}

tasks.register('createPluginZip', Zip) {
	archiveFileName = "AngularDemoPlugin.zip"
	
    into('jars') {
        from jar
        from configurations.includeLibraries
    }
    into('import/install') {
    	from("config") {
    		include "**"
    		exclude "*Example*"
    	}
    }
    from('.') {
        include 'manifest.xml'
        include 'db/**'
    	include 'messages/**'
        include 'ui/page.xhtml'
        // CSS files moved here by ng-build.sh
        include 'ui/css/**/*.css'
        // JS files moved here by ng-build.sh
        include "ui/js/**/*.js"
        filter { it.replace("%%BUILD_VERSION%%", getDate() ) }
    }

    dependsOn 'jar'

    dependsOn 'angularBuild'
}
